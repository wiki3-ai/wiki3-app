name: Build Windows App

# Produces the NSIS installer, which is the Windows counterpart of the DMG.
#
# No signing secrets are needed: unlike macOS there is no notarization step, so
# an unsigned installer is a usable artifact. Windows shows a SmartScreen
# warning on first run, which is the cost of not holding an Authenticode
# certificate.
#
# This job cannot be replaced by a cross-compiled check on a Mac. `cargo check
# --target x86_64-pc-windows-msvc` stops at the build script, which needs a
# Windows resource compiler, so compiling here is the only honest way to find
# code that only works on macOS.
on:
  push:
    branches: [docker, main]
    tags: ["v*"]
  pull_request:
    branches: [docker, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# A commit that supersedes another — a follow-up push, a merge — makes the earlier
# build pointless, since its only output is an artifact nobody will download. On
# 2026-09-13 four near-identical NSIS builds were running at once for this reason.
# A tag is a different ref, so a release build gets its own group and is not
# cancelled by branch activity.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows (NSIS)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        # The default on Windows runners is PowerShell, where a trailing `\` is
        # not a line continuation — it gets treated as a literal argument and
        # the next line is executed as its own command. Git Bash is present, so
        # use it rather than writing PowerShell-specific multi-line commands.
        shell: bash

    steps:
      - uses: actions/checkout@v7

      # `devcontainer-core` is a relative path dependency pointing at a sibling
      # checkout (`../../devcontainers-cli/...`), so CI has to reproduce that
      # layout or cargo cannot even resolve the manifest. This is why no CI
      # build of this app has ever worked, macOS included.
      - name: Checkout devcontainer-core (sibling path dependency)
        run: |
          git clone --depth 1 --branch docker-runtime \
            https://github.com/wiki3-ai/devcontainers-cli.git \
            "${{ github.workspace }}/../devcontainers-cli"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # Lints before the long build, so a style regression costs two minutes
      # instead of fifteen. `--all-targets` also compiles the test targets,
      # which makes the separate `cargo check` step unnecessary.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        # The Rust test suite is platform-independent; running it here is how a
        # Windows-only regression gets caught rather than assumed absent.
        run: cargo test

      # tauri-build validates that frontendDist exists, so the web assets have
      # to be built before cargo runs. `tauri build` would run this itself via
      # beforeBuildCommand; doing it separately fails fast on a TypeScript error
      # instead of after a full Rust compile.
      - name: Build frontend
        run: npm run build

      # Picks up `tauri.windows.conf.json`, which retargets the bundle from the
      # macOS `app`/`dmg` pair to an NSIS installer.
      - name: Build app
        run: npx tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Wiki3-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Appends the installer to the release for this tag. The macOS workflow
      # owns creating the release; this only adds an asset, and leaves the
      # draft flag alone so a draft stays a draft.
      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
